name: פרסום ל-GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: הכנת קבצי האתר
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest *.png apps-script .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
      # GitHub sometimes doesn't list a just-uploaded artifact yet; a short wait avoids a failed deploy
      - name: המתנה קצרה
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
